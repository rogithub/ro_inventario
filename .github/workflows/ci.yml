# Revisiones en cada push: formato, clippy, audit y pruebas (docs/decisiones/2026-09-29-formato-y-linters.md).
# Las mismas que corre herramientas/revisar.sh en la máquina del dueño.
name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  revisar:
    runs-on: ubuntu-latest

    # Postgres desechable para las pruebas de la base (cada prueba crea la suya).
    # La contraseña solo existe dentro de esta corrida de CI: no es un secreto.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres

    steps:
      - name: Bajar el código
        uses: actions/checkout@v4

      # rustup viene en el runner y lee rust-toolchain.toml: instala la versión fijada.
      - name: Instalar Rust
        run: rustup show

      - name: Caché de lo compilado
        uses: Swatinem/rust-cache@v2

      - name: Instalar cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Formato
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Dependencias con vulnerabilidades conocidas
        run: cargo audit

      - name: Pruebas
        run: cargo test

  # Pruebas E2E: la aplicación real, contra un Postgres desechable, en Firefox y en el ancho del iPad.
  e2e:
    needs: revisar
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres

    steps:
      - name: Bajar el código
        uses: actions/checkout@v4

      - name: Instalar Rust
        run: rustup show

      - name: Caché de lo compilado
        uses: Swatinem/rust-cache@v2

      # Compila antes, para que Playwright no espere la compilación al arrancar la app.
      - name: Compilar la aplicación
        run: cargo build -p privada

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Instalar dependencias de las pruebas
        working-directory: e2e
        run: npm ci

      - name: Instalar navegadores
        working-directory: e2e
        run: npx playwright install --with-deps firefox chromium

      - name: Tipos de las pruebas
        working-directory: e2e
        run: npx tsc --noEmit

      - name: Pruebas E2E
        working-directory: e2e
        run: npx playwright test

      - name: Guardar el reporte si fallan
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-e2e
          path: e2e/playwright-report
          retention-days: 7

  # Publica la imagen en ghcr.io solo si todo lo anterior pasó, y solo desde main.
  # Todavía nada la despliega.
  imagen:
    needs: [revisar, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Bajar el código
        uses: actions/checkout@v4

      - name: Preparar buildx
        uses: docker/setup-buildx-action@v3

      - name: Entrar a ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Etiquetas
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/privada
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Construir y publicar
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64  # el cluster es x86
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
