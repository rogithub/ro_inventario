<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Inventario{% endblock %}</title>
  <link rel="stylesheet" href="/static/vendor/bootstrap.min.css">
  <link rel="stylesheet" href="/static/vendor/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/static/css/main.css">
  {% block head %}{% endblock %}
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom shadow-sm mb-3" x-data="{ open: false }">
    <div class="container">
      <a class="navbar-brand" href="/">Inicio</a>
      <button class="navbar-toggler" type="button" @click="open = !open">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="navbar-collapse collapse d-lg-flex justify-content-between" :class="{ show: open }">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link {% block active_ventas %}{% endblock %}" href="/ventas">Ventas</a></li>
          <li class="nav-item"><a class="nav-link {% block active_compras %}{% endblock %}" href="/compras">Compras</a></li>
          <li class="nav-item"><a class="nav-link {% block active_productos %}{% endblock %}" href="/productos">Productos</a></li>
          <li class="nav-item"><a class="nav-link {% block active_clientes %}{% endblock %}" href="/clientes">Clientes</a></li>
          <li class="nav-item"><a class="nav-link {% block active_proveedores %}{% endblock %}" href="/proveedores">Proveedores</a></li>
        </ul>
        <ul class="navbar-nav">
          <li class="nav-item dropdown" x-data="{ userOpen: false }" @click.outside="userOpen = false">
            <a class="nav-link dropdown-toggle" href="#" @click.prevent="userOpen = !userOpen">
              <i class="bi bi-person"></i>
            </a>
            <ul class="dropdown-menu dropdown-menu-end" :class="{ show: userOpen }">
              <li><a class="dropdown-item" href="/logout">
                <i class="bi bi-box-arrow-right me-1"></i>Cerrar sesión
              </a></li>
            </ul>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container pb-3">
    {% block content %}{% endblock %}
  </main>

  <footer class="border-top text-body-secondary d-print-none mt-4">
    <div class="container py-2">
      &copy; 2022 - Inventario
    </div>
  </footer>

  <div x-data="{ atTop: true, atBottom: false }"
       @scroll.window="atTop = window.scrollY < 80; atBottom = (window.innerHeight + window.scrollY) >= document.body.scrollHeight - 80"
       class="d-flex flex-column gap-1 d-print-none"
       style="position: fixed; bottom: 1.5rem; right: 1rem; z-index: 1030;">
    <button x-show="!atTop" @click="window.scrollTo({ top: 0, behavior: 'smooth' })"
            class="btn btn-secondary btn-sm opacity-75" title="Ir arriba">
      <i class="bi bi-arrow-up"></i>
    </button>
    <button x-show="!atBottom" @click="window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' })"
            class="btn btn-secondary btn-sm opacity-75" title="Ir abajo">
      <i class="bi bi-arrow-down"></i>
    </button>
  </div>

  <script src="/static/vendor/htmx.min.js"></script>
  <script src="/static/vendor/alpine.min.js" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
