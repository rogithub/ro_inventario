# Workspace de ro_inventario. Estructura y reglas: docs/decisiones/2026-09-29-estructura-de-crates.md
[workspace]
resolver = "3"
members = [
    "crates/kernel",
    "crates/inventario",
    "crates/usuarios",
    "crates/negocio-config",
    "crates/db",
    "apps/privada",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

# Una sola versión de cada dependencia para todo el workspace.
[workspace.dependencies]
kernel = { path = "crates/kernel" }
inventario = { path = "crates/inventario" }
usuarios = { path = "crates/usuarios" }
negocio-config = { path = "crates/negocio-config" }
db = { path = "crates/db" }

serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"
serde_json = "1.0.151"

# Web y logs (apps).
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal"] }
axum = "0.8.9"
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["request-id", "trace", "util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
http-body-util = "0.1.5"
# Plantillas revisadas al compilar (docs/decisiones/2026-09-30-pantallas-del-servidor.md).
askama = "0.16.1"

# Contraseñas (Argon2id; la sal sale de getrandom) y pedirlas en la terminal sin mostrarlas.
argon2 = "0.6.0"
rpassword = "7.5.4"
# Sesiones: token aleatorio en la cookie; en la base, solo su huella SHA-256.
getrandom = "0.4.3"
sha2 = "0.11.0"

# Base de datos. Sin TLS: la conexión va dentro del cluster o a localhost.
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "uuid", "rust_decimal"] }
# Identificadores: las tablas usan uuid (gen_random_uuid() en la base); kernel lo reexporta.
uuid = { version = "1.26.1", default-features = false, features = ["std"] }
# Dinero y cantidades: decimal exacto, nunca flotantes (docs/decisiones/2026-09-29-formato-y-linters.md).
# Cada columna fija su precisión (precios con 2 decimales); kernel lo reexporta.
rust_decimal = { version = "1.43.0", default-features = false, features = ["std"] }

# Reglas para todos los crates (docs/decisiones/2026-09-29-formato-y-linters.md).
# Cada crate las hereda con `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
