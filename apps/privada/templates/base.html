<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {# htmx pinta también las respuestas de error (422 validación, 500 falla): el mensaje queda en su lugar. #}
  <meta name="htmx-config" content='{"responseHandling":[{"code":"204","swap":false},{"code":".*","swap":true}]}'>
  <title>{% block title %}{% endblock %} · {{ negocio }}</title>
  <link rel="stylesheet" href="/static/bootstrap.min.css">
  <link rel="stylesheet" href="/static/bootstrap-icons.min.css">
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/bootstrap.bundle.min.js" defer></script>
</head>
<body>
  <nav class="navbar bg-body-tertiary mb-3">
    <div class="container">
      <span class="navbar-brand">{{ negocio }}</span>
      {% if let Some(nombre) = usuario_nombre %}
      <div class="d-flex align-items-center gap-2">
        <span class="navbar-text"><i class="bi bi-person-circle"></i> {{ nombre }}</span>
        <form method="post" action="/logout" class="m-0">
          <button type="submit" class="btn btn-outline-secondary" title="Salir" aria-label="Salir">
            <i class="bi bi-box-arrow-right"></i>
          </button>
        </form>
      </div>
      {% endif %}
    </div>
  </nav>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
